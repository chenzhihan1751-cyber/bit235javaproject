spring.application.name=wikiadminlogin

# The lab machine already has something on 8080 from time to time, and 8081 is
# free there, so the app is pinned to 8081 to keep the URL predictable.
server.port=8081

# Templates are re-read on every request while the app is running, which makes
# editing an HTML file and refreshing the browser enough to see the change.
spring.thymeleaf.cache=false

# The login form has no file upload and no large payload, so the two default
# sizes are left alone. They are listed here only as a reminder of what the
# server accepts.
server.tomcat.max-http-form-post-size=2MB

# Console logging kept at INFO: enough to see "Tomcat started on port 8081"
# without burying it in debug output.
logging.level.root=INFO
